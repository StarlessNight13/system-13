name: Release CSS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish System 13 CSS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Use a tag such as v0.1.0 or v0.2.0-beta.1."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release asset
        shell: bash
        run: |
          test -f registry/system13/system13-daisyui.css

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: registry/system13/system13-daisyui.css
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Replacing CSS asset."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" "$ASSET" \
                --verify-tag \
                --generate-notes \
                --title "System 13 $TAG"
            else
              gh release create "$TAG" "$ASSET" \
                --target "$GITHUB_SHA" \
                --generate-notes \
                --title "System 13 $TAG"
            fi
          fi
